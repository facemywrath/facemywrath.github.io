name: Matchweaver Android Release APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "matchweaver/**"
      - ".github/workflows/**"
  workflow_dispatch:

jobs:
  build-android-matchweaver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install npm dependencies (matchweaver)
        working-directory: matchweaver
        run: |
          npm ci || npm install

      - name: Sync Capacitor Android project (matchweaver)
        working-directory: matchweaver
        run: |
          npx cap sync android

      - name: Build Android release APK (matchweaver)
        working-directory: matchweaver/android
        run: |
          ./gradlew assembleRelease

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: matchweaver/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: matchweaver-release-apk
          path: matchweaver/android/app/build/outputs/apk/release/app-release-signed.apk

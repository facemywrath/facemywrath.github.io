<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Match Weaver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" aria-hidden="true" style="position:absolute;pointer-events:none">
  <defs>
    <filter id="glow-sm"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
</svg>

<!-- OVERLAYS -->
<div id="screen-overlay" class="overlay" style="display:none">
  <div id="screen-content" class="card"></div>
</div>

<div id="lore-modal" class="overlay hidden">
  <div class="card lore-card">
    <div id="lore-icon"  class="lore-icon"></div>
    <div id="lore-title" class="lore-title"></div>
    <div id="lore-text"  class="lore-text"></div>
    <button id="lore-close" class="pill-btn">CONTINUE ›</button>
  </div>
</div>

<div id="level-select-modal" class="overlay hidden">
  <div class="card lvlsel-card">
    <div class="lvlsel-header">
      <div class="ov-sub" style="margin:0;font-size:11px;letter-spacing:2px;font-weight:900">SELECT LEVEL</div>
    </div>
    <div id="lvlsel-grid" class="lvlsel-grid"></div>
    <div class="lvlsel-footer">
      <button class="pill-btn secondary small-btn" onclick="closeLevelSelect()">◂ Back</button>
      <button class="pill-btn secondary small-btn" onclick="openSpellLoadoutFromLevelSelect()">⚡ Spells</button>
    </div>
  </div>
</div>

<div id="confirm-modal" class="overlay hidden">
  <div class="card confirm-card">
    <div class="confirm-icon">⚠️</div>
    <div class="lore-title" id="confirm-title">Clear Save Data?</div>
    <div class="lore-text">This will erase all stars and progress. This cannot be undone.</div>
    <div class="confirm-btns">
      <button class="pill-btn secondary small-btn" onclick="closeConfirm()">Cancel</button>
      <button class="pill-btn danger small-btn"    onclick="executeClearSave()">Clear All</button>
    </div>
  </div>
</div>

<!-- GAME SHELL -->
<div id="shell">

  <!-- Main Menu Overlay -->
  <div id="main-menu" class="hidden"></div>

  <div id="topbar">
    <div class="tb-left">
      <div class="stat"><span class="slbl">LVL</span><span id="level-display" class="sval">1</span></div>
      <div class="stat"><span class="slbl">SCORE</span><span id="score-display" class="sval">0</span></div>
    </div>
    <div id="logo">MATCH<em>WEAVER</em></div>
    <div class="tb-right">
      <div id="quota-wrap">
        <span class="slbl">GOAL</span>
        <div id="quota-panel"></div>
      </div>
      <button id="btn-menu" class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="play-area">
    <div id="board-wrap">
      <canvas id="game-canvas"></canvas>
      <div id="col-zones"></div>
    </div>
    <div id="sidebar">
      <div class="sb-lbl">NEXT</div>
      <canvas id="preview-canvas" width="76" height="76"></canvas>
      <div class="sb-lbl" style="margin-top:10px">MOVES</div>
      <div id="move-count" class="sval" style="font-size:20px">—</div>
      <div class="sb-lbl" style="margin-top:8px">STARS</div>
      <div id="live-stars"></div>
      <div class="sb-lbl" style="margin-top:8px">MANA</div>
      <div id="mana-display"></div>
      <div id="hearts-display" class="hearts-display" style="display:none"></div>
      <div id="skull-timer-display" class="skull-timer-display" style="display:none"></div>
      <div id="tile-legend" class="tile-legend hidden"></div>
    </div>
  </div>

  <div id="controls">
    <div id="spell-bar" class="hidden"></div>
    <div id="ctrl-row">
      <button id="btn-left"      class="ctrl dir"  aria-label="Move left">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button id="btn-rotate"    class="ctrl rot"  aria-label="Rotate CW">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 .49-4.5"/></svg>
      </button>
      <button id="btn-drop"      class="ctrl drop" aria-label="Drop">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="3" x2="12" y2="21"/><polyline points="5 14 12 21 19 14"/></svg>
        <span>DROP</span>
      </button>
      <button id="btn-rotateccw" class="ctrl rot"  aria-label="Rotate CCW">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-.49-4.5"/></svg>
      </button>
      <button id="btn-right"     class="ctrl dir"  aria-label="Move right">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

</div>

<script src="game.js"></script>
</body>
</html>
